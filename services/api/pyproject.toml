[project]
name = "pinflow-api"
version = "0.1.0"
description = "Pinflow backend service: kicad-sch-api emission + (future) datasheet ingestion"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "kicad-sch-api>=0.5.6",
    "kicad-python>=0.7.0",
    "anthropic>=0.45",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "google-auth>=2.30",
    # install_symbol_to_project shells out to .venv/bin/easyeda2kicad; without
    # this declared, a fresh install has no symbol-fetch path for parts with
    # no bundled KiCad symbol (easyeda.fetch_symbol → fetch_failed).
    "easyeda2kicad>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Never source-build cryptography. Both this repo's fresh dev envs (uv resolves
# an x86_64 CPython under Rosetta on arm64 Macs) and the macos-x64 release
# sidecar (cross-builds an x86_64 sidecar) lack a working source-build path:
# building cryptography from source pulls in maturin + a Rust openssl-sys
# compile that fails for lack of OpenSSL. Pinning to the prebuilt wheel here
# makes EVERY uv invocation (fresh-clone `uv pip install -e .`, dev.sh, CI
# sidecar) safe — same effect as `--only-binary cryptography`, but as a project
# property no call site can forget. See reference: services/api/.venv is x86_64.
no-build-package = ["cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinflow_api"]
