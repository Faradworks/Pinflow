<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pinflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // KiCanvas's <kicanvas-embed theme="..."> attribute is not forwarded to the
      // child <kc-schematic-app>; the actual theme is read from a global
      // Preferences singleton (default "witchhazel") at module init. Seed the
      // singleton's storage key before the bundle loads so we render in "kicad".
      try {
        window.localStorage.setItem("kc:prefs:theme", JSON.stringify({ val: "kicad" }));
      } catch (_) {}
    </script>
    <script type="module" src="/kicanvas/kicanvas.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
