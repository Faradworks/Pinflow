name: Release

# Cut a release by pushing a tag that matches the app version, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# That builds every OS and publishes a DRAFT GitHub Release with the installers
# attached (review, then publish). Use the "Run workflow" button for a dry-run
# build that uploads the installers as workflow artifacts without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # tauri-action creates the GitHub Release + uploads assets

jobs:
  build:
    name: ${{ matrix.label }}
    # Real releases (tag pushes) run in the protected `release` environment so the
    # Apple signing secrets are gated behind required-reviewer approval. Manual
    # `workflow_dispatch` dry-runs use no environment (ungated, unsigned).
    # NOTE: environment protection rules are free on PUBLIC repos / paid private
    # plans only — on a free private repo this label is inert (no gating). Move the
    # APPLE_* secrets to `release` *environment* secrets (and off repo scope) on the
    # public repo for the gate to actually bite.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # `--config src-tauri/tauri.bundle.conf.json` is a build-only overlay that
        # declares the frozen PyInstaller sidecar as a bundled resource. It's kept
        # out of the base tauri.conf.json so `tauri dev` doesn't abort on the
        # missing-glob check (see scripts/build_desktop.sh, src-tauri/src/lib.rs).
        include:
          - label: macos-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.signing.conf.json"
            py-arch: ""
          # Intel macOS is cross-built on an Apple Silicon runner (Rust target +
          # an x86_64 PyInstaller sidecar via Rosetta 2) to avoid GitHub's scarce
          # macos-13 Intel runners. See scripts/build_sidecar.sh PINFLOW_PY_ARCH.
          - label: macos-x64
            os: macos-14
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.signing.conf.json"
            py-arch: "x86_64"
          - label: windows-x64
            os: windows-latest
            rust-target: ""
            tauri-args: "--bundles nsis,msi --config src-tauri/tauri.bundle.conf.json"
            py-arch: ""
          - label: linux-x64
            os: ubuntu-22.04
            rust-target: ""
            tauri-args: "--bundles deb,appimage --config src-tauri/tauri.bundle.conf.json"
            py-arch: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json version is the single source of truth for installer
      # filenames; refuse to publish if the pushed tag disagrees with it.
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cfg="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$cfg" != "$tag" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $cfg" >&2
            exit 1
          fi

      # Tauri v2 Linux system dependencies (webview, AppImage tooling).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            build-essential file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: astral-sh/setup-uv@v5

      # Import the Developer ID cert into a keychain BEFORE the sidecar build, so
      # build_sidecar.sh can sign the nested Mach-O files (.so/.dylib + launcher)
      # with it. Notarization requires every nested binary to carry a Developer ID
      # signature + secure timestamp; tauri-action only signs the outer .app, so
      # the sidecar must be signed here. Same cert tauri-action uses for the .app.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # The Intel sidecar is an x86_64 binary built on this arm64 runner; it runs
      # (build + smoke test) under Rosetta 2. Pre-installed on the image, but be
      # explicit so the leg fails loudly rather than mysteriously if it's absent.
      - name: Ensure Rosetta 2
        if: matrix.py-arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      # PyInstaller can't cross-compile across OS — freeze the sidecar natively
      # per OS. PINFLOW_PY_ARCH cross-builds x86_64 on Apple Silicon (macOS only).
      - name: Build Python sidecar
        shell: bash
        env:
          PINFLOW_PY_ARCH: ${{ matrix.py-arch }}
          # macOS: sign the sidecar's nested Mach-O with the Developer ID just
          # imported (keep in lockstep with tauri.signing.conf.json). Empty/unset
          # elsewhere → build_sidecar.sh ad-hoc signs (or no-ops off macOS).
          PINFLOW_MAC_SIGN_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: Siddharth Kothari (8RY4V8V3Y6)' || '' }}"
        run: bash scripts/build_sidecar.sh

      # Fail fast on per-OS packaging gaps before the long Tauri bundle step.
      - name: Smoke-test frozen sidecar
        shell: bash
        run: bash scripts/smoke_sidecar.sh

      # macOS code signing + notarization. Write the App Store Connect API key
      # (.p8) to disk from a base64 secret and hand tauri-action its path; the
      # Developer ID cert (.p12) is imported by tauri-action from APPLE_CERTIFICATE.
      # The signing identity itself comes from tauri.signing.conf.json (not secret).
      - name: Set up notarization API key
        if: runner.os == 'macOS'
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # On a tag: create/append a draft GitHub Release with the installers.
      # On manual dispatch: tagName is empty, so tauri-action only builds.
      - name: Build app (and release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS-only; harmlessly empty/ignored on Windows + Linux legs.
          # The Developer ID cert is already in the keychain (Import step above),
          # so tauri build signs the outer .app with the identity from
          # tauri.signing.conf.json — no APPLE_CERTIFICATE here (that would make
          # tauri-action create a second, competing keychain). Notarization runs
          # via the App Store Connect API key (APPLE_API_KEY_PATH exported above):
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Pinflow {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.tauri-args }}

      # Dry-run / dispatch: keep the installers downloadable from the run.
      - name: Upload installers (dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pinflow-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
