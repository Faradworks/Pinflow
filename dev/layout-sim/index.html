<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinflow · force-directed layout viewer</title>
<style>
  :root { --bg:#11141a; --panel:#1a1f29; --ink:#e6e9ef; --mut:#8b93a3;
          --line:#2a3140; --rail:#e0533d; --gnd:#7f8794; --sig:#4a9eff;
          --ic:#d8b84a; --acc:#43d18b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
              font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #app { display:flex; flex-direction:column; height:100%; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px;
         background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #bar button, #bar label.btn { background:#222936; color:var(--ink); border:1px solid var(--line);
         border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  #bar button:hover, #bar label.btn:hover { border-color:var(--acc); }
  #bar button:disabled { opacity:.4; cursor:default; }
  #scrub { flex:1; min-width:160px; accent-color:var(--acc); }
  .chk { display:flex; align-items:center; gap:4px; color:var(--mut); cursor:pointer; }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  #hud { color:var(--mut); white-space:nowrap; }
  #hud b { color:var(--ink); }
  #hud .warn { color:var(--rail); }
  #wrap { flex:1; display:flex; min-height:0; }
  #simpane { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  /* right pane: the real kicad-cli render of the settled layout (server mode only) */
  #renderpane { display:none; width:42%; min-width:220px; flex-direction:column;
                border-left:1px solid var(--line); background:#0e1117; }
  body.live #renderpane { display:flex; }
  #renderpane .cap { padding:6px 10px; color:var(--mut); font-size:11px;
                     border-bottom:1px solid var(--line); white-space:nowrap;
                     overflow:hidden; text-overflow:ellipsis; }
  #renderpane .cap b { color:var(--ink); }
  #rbox { flex:1; position:relative; display:flex; align-items:center;
          justify-content:center; padding:10px; min-height:0; }
  #rimg { max-width:100%; max-height:100%; object-fit:contain; background:#fff;
          border-radius:4px; display:none; box-shadow:0 2px 12px rgba(0,0,0,.5); }
  #rstat { position:absolute; top:10px; left:0; right:0; text-align:center;
           color:var(--mut); font-size:11px; pointer-events:none; }
  #rstat.err { color:var(--rail); }
  /* instant, styled tooltip (replaces native title= which renders unreliably) */
  #tip { position:fixed; z-index:1000; max-width:280px; pointer-events:none;
         background:#0c0f14; color:var(--ink); border:1px solid var(--acc);
         border-radius:6px; padding:6px 8px; font-size:11px; line-height:1.45;
         box-shadow:0 6px 18px rgba(0,0,0,.55); opacity:0; transition:opacity .07s; }
  #tip.show { opacity:1; }
  #drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:var(--mut); pointer-events:none; text-align:center; }
  #drop.hide { display:none; }
  .legend { position:absolute; right:12px; bottom:10px; color:var(--mut);
            background:rgba(20,24,32,.8); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  .legend i { display:inline-block; width:11px; height:3px; vertical-align:middle; margin-right:5px; }
  input[type=range].sp { width:90px; accent-color:var(--acc); }
  #tune { position:absolute; left:10px; top:10px; width:226px; max-height:calc(100% - 20px);
          overflow:auto; background:rgba(20,24,32,.93); border:1px solid var(--line);
          border-radius:8px; padding:10px 11px; backdrop-filter:blur(2px); }
  #tune.hide { display:none; }
  #tune h4 { margin:0 0 7px; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
             color:var(--acc); }
  .trow { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .trow label { width:80px; color:var(--mut); font-size:11px; cursor:help; }
  .trow input[type=range] { flex:1; min-width:0; accent-color:var(--acc); }
  .trow .val { width:40px; text-align:right; font-size:11px; color:var(--ink);
               font-variant-numeric:tabular-nums; }
  .trow.star { border-left:2px solid var(--acc); margin-left:-11px; padding-left:9px; }
  .trow.star label { color:var(--acc); font-weight:bold; }
  #tune select { flex:1; min-width:0; background:#222936; color:var(--ink);
                 border:1px solid var(--line); border-radius:5px; padding:3px 4px; font:inherit; }
  #tune .tsep { height:1px; background:var(--line); margin:8px 0; }
  #tune button { background:#222936; color:var(--ink); border:1px solid var(--line);
                 border-radius:5px; padding:4px 9px; cursor:pointer; font:inherit; }
  #tune button:hover { border-color:var(--acc); }
  #tstat { font-size:10px; color:var(--mut); margin-left:6px; }
  #tstat.err { color:var(--rail); }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <label class="btn" data-tip="load a static trace dump (graph.json from dump_layout_graph.py <fixture> --trace)">Load JSON<input id="file" type="file" accept=".json" hidden></label>
    <span class="sep"></span>
    <button id="back" data-tip="step one iteration back">⏮</button>
    <button id="play" data-tip="play / pause the relaxation animation">▶ play</button>
    <button id="fwd" data-tip="step one iteration forward">⏭</button>
    <input id="scrub" type="range" min="0" max="0" value="0" data-tip="scrub through the relaxation iterations (frames)">
    <span class="sep"></span>
    <label class="chk" data-tip="animation playback speed (frames advanced per tick)">speed <input id="speed" class="sp" type="range" min="1" max="10" value="3"></label>
    <label class="chk" data-tip="show each non-IC body's keep-out box (half-size + margin); a box turns red when two overlap — that pair is the symbol_overlap penalty the repulsion force fights"><input id="gate" type="checkbox" checked> gate boxes</label>
    <label class="chk" data-tip="draw each net as pin stubs + L-routes to the net centroid (the star-attraction target each pin is pulled toward)"><input id="trunk" type="checkbox" checked> net trunks</label>
    <button id="snap" data-tip="toggle the final grid-snapped layout (what the placer emits, after force-relaxation + snap/label)">show snapped</button>
    <span class="sep"></span>
    <span id="hud">—</span>
  </div>
  <div id="wrap">
    <div id="simpane">
    <canvas id="cv"></canvas>
    <div id="tune" class="hide">
      <h4>live tuner</h4>
      <div class="trow" data-tip="which corpus circuit to relax — switching re-runs the real fdcore.simulate"><label>fixture</label><select id="fixture"></select></div>
      <div class="tsep"></div>
      <div id="sliders"></div>
      <div class="tsep"></div>
      <div class="trow"><button id="reset" data-tip="restore every gain to DEFAULT_GAINS and re-run">reset defaults</button><span id="tstat"></span></div>
    </div>
    <div id="drop">drop a <b>graph.json</b> here (or use “Load JSON”)<br>
      <span style="font-size:11px">generate with: <code>scripts/dump_layout_graph.py &lt;fixture&gt; --trace --out dev/layout-sim/graph.json</code></span></div>
    <div class="legend">
      <div><i style="background:var(--rail)"></i>rail&nbsp; <i style="background:var(--gnd)"></i>gnd&nbsp; <i style="background:var(--sig)"></i>signal</div>
    </div>
    </div><!-- /#simpane -->
    <div id="renderpane">
      <div class="cap"><b>KiCad output</b> — final placed + routed (kicad-cli)</div>
      <div id="rbox"><div id="rstat">drag a knob to render…</div><img id="rimg" alt="KiCad render of the settled layout"></div>
    </div>
  </div>
</div>
<div id="tip"></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let DATA=null, frame=0, playing=false, showSnap=false, fit=null, raf=0, acc=0;

const COL = {rail:'#e0533d', power:'#e0533d', ground:'#7f8794', signal:'#4a9eff'};
const STUB = 2.54;

function rot(ox,oy,deg){ deg=((deg%360)+360)%360;
  if(deg===90) return [-oy,ox]; if(deg===180) return [-ox,-oy];
  if(deg===270) return [oy,-ox]; return [ox,oy]; }

// position lookup returns [x, y, rot] arrays so pinWorld/facing index uniformly
function pinWorld(node,pin,pos){ const [rx,ry]=rot(pin.ox,pin.oy,pos[2]); return [pos[0]+rx,pos[1]+ry]; }
function facing(node,pin,pos){ return rot(pin.fx,pin.fy,pos[2]); }

function framePositions(){
  const m={};
  if(showSnap){ for(const n of DATA.graph.nodes){ const s=DATA.snapped[n.ref]||[0,0]; m[n.ref]=[s[0],s[1],0]; } return m; }
  for(const nd of DATA.frames[frame].nodes) m[nd.ref]=[nd.x,nd.y,nd.rot||0];
  return m;
}

function computeFit(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const consider=(x,y)=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);};
  const byRef=Object.fromEntries(DATA.graph.nodes.map(n=>[n.ref,n]));
  // union over all frames so the view never jumps during playback
  for(const f of DATA.frames) for(const nd of f.nodes){
    const n=byRef[nd.ref]; consider(nd.x-n.hx,nd.y-n.hy); consider(nd.x+n.hx,nd.y+n.hy);
  }
  for(const n of DATA.graph.nodes){ const s=DATA.snapped[n.ref]; if(s){ consider(s[0]-n.hx,s[1]-n.hy); consider(s[0]+n.hx,s[1]+n.hy);} }
  return {minX,minY,maxX,maxY};
}

function tf(){
  const pad=40, W=cv.width, H=cv.height;
  const sx=(W-2*pad)/Math.max(1,fit.maxX-fit.minX), sy=(H-2*pad)/Math.max(1,fit.maxY-fit.minY);
  const s=Math.min(sx,sy);
  const ox=pad+((W-2*pad)-s*(fit.maxX-fit.minX))/2, oy=pad+((H-2*pad)-s*(fit.maxY-fit.minY))/2;
  return (x,y)=>[ox+(x-fit.minX)*s, oy+(y-fit.minY)*s];
}

function draw(){
  if(!DATA) return;
  cv.width=cv.clientWidth; cv.height=cv.clientHeight;
  ctx.clearRect(0,0,cv.width,cv.height);
  const W=tf(), pos=framePositions(), byRef=Object.fromEntries(DATA.graph.nodes.map(n=>[n.ref,n]));

  // grid
  ctx.strokeStyle='#1c2230'; ctx.lineWidth=1;
  const step=12.7;
  for(let x=Math.ceil(fit.minX/step)*step; x<fit.maxX; x+=step){ const a=W(x,fit.minY),b=W(x,fit.maxY);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke(); }
  for(let y=Math.ceil(fit.minY/step)*step; y<fit.maxY; y+=step){ const a=W(fit.minX,y),b=W(fit.maxX,y);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke(); }

  // edges: orthogonal stub from each pin's facing, then L to the net centroid
  for(const e of DATA.graph.edges){
    const pts=[];
    for(const ep of e.endpoints){ const n=byRef[ep.ref]; if(!n) continue;
      const pin=n.pins.find(p=>p.num===ep.pin); if(!pin) continue;
      pts.push([n,pin,pinWorld(n,pin,pos[ep.ref])]); }
    if(pts.length<2) continue;
    const cx=pts.reduce((a,p)=>a+p[2][0],0)/pts.length, cy=pts.reduce((a,p)=>a+p[2][1],0)/pts.length;
    ctx.strokeStyle=COL[e.kind]||COL.signal; ctx.lineWidth=1.5; ctx.globalAlpha=.9;
    for(const [n,pin,pw] of pts){
      const f=facing(n,pin,pos[n.ref]);
      const sx=pw[0]+f[0]*STUB, sy=pw[1]+f[1]*STUB;
      const a=W(pw[0],pw[1]), b=W(sx,sy);
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);   // the stub
      if($('trunk').checked){
        const vert=Math.abs(f[1])>=Math.abs(f[0]);
        const mid = vert ? W(sx,cy) : W(cx,sy);
        const c=W(cx,cy);
        ctx.lineTo(mid[0],mid[1]); ctx.lineTo(c[0],c[1]);             // L to centroid
      }
      ctx.stroke();
    }
    if($('trunk').checked){ const c=W(cx,cy); ctx.fillStyle=COL[e.kind]||COL.signal;
      ctx.globalAlpha=.5; ctx.beginPath(); ctx.arc(c[0],c[1],2.5,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
  }

  // gate boxes (non-IC body bbox; red where two overlap within the 2.54 margin)
  if($('gate').checked){
    const m=DATA.config.margin||2.54, bodies=DATA.graph.nodes.filter(n=>!n.is_ic)
      .map(n=>({n, x:pos[n.ref][0], y:pos[n.ref][1]}));
    const bad=new Set();
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
      const a=bodies[i],b=bodies[j];
      if((a.n.hx+b.n.hx+m)-Math.abs(a.x-b.x)>0 && (a.n.hy+b.n.hy+m)-Math.abs(a.y-b.y)>0){ bad.add(i);bad.add(j); } }
    bodies.forEach((bd,i)=>{ const tl=W(bd.x-bd.n.hx,bd.y-bd.n.hy), br=W(bd.x+bd.n.hx,bd.y+bd.n.hy);
      ctx.setLineDash([4,3]); ctx.lineWidth=1; ctx.strokeStyle=bad.has(i)?'#e0533d':'#36405288';
      ctx.strokeRect(tl[0],tl[1],br[0]-tl[0],br[1]-tl[1]); ctx.setLineDash([]); });
  }

  // nodes
  for(const n of DATA.graph.nodes){
    const p=pos[n.ref]; const tl=W(p[0]-n.hx,p[1]-n.hy), br=W(p[0]+n.hx,p[1]+n.hy);
    ctx.fillStyle = n.is_ic ? 'rgba(216,184,74,.16)' : 'rgba(200,210,225,.06)';
    ctx.strokeStyle = n.is_ic ? '#d8b84a' : '#9aa6ba'; ctx.lineWidth=1.5;
    ctx.fillRect(tl[0],tl[1],br[0]-tl[0],br[1]-tl[1]);
    ctx.strokeRect(tl[0],tl[1],br[0]-tl[0],br[1]-tl[1]);
    // pins
    for(const pin of n.pins){ const pw=pinWorld(n,pin,p); const a=W(pw[0],pw[1]);
      ctx.fillStyle='#cdd6e6'; ctx.beginPath(); ctx.arc(a[0],a[1],2,0,7); ctx.fill(); }
    const c=W(p[0],p[1]);
    ctx.fillStyle = n.is_ic ? '#f0d98a' : '#dce3ef';
    ctx.font = (n.is_ic?'bold ':'')+'12px ui-monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.ref, c[0], c[1]);
  }

  // HUD
  let overlaps=0;
  { const m=DATA.config.margin||2.54, b=DATA.graph.nodes.filter(n=>!n.is_ic).map(n=>({n,x:pos[n.ref][0],y:pos[n.ref][1]}));
    for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++)
      if((b[i].n.hx+b[j].n.hx+m)-Math.abs(b[i].x-b[j].x)>0 && (b[i].n.hy+b[j].n.hy+m)-Math.abs(b[i].y-b[j].y)>0) overlaps++; }
  const it = showSnap ? 'snapped' : (DATA.frames[frame]?.iter ?? frame);
  $('hud').innerHTML = `<b>${DATA.name}</b> · ${DATA.graph.nodes.length} parts, ${DATA.graph.edges.length} nets `
    + `· iter <b>${it}</b> · frame ${frame+1}/${DATA.frames.length} `
    + `· margin overlaps: <span class="${overlaps?'warn':''}">${overlaps}</span>`;
}

function setData(d){
  DATA=d; frame=0; showSnap=false; fit=computeFit();
  $('scrub').max=d.frames.length-1; $('scrub').value=0; $('drop').classList.add('hide');
  draw();
}
function step(n){ showSnap=false; frame=Math.max(0,Math.min(DATA.frames.length-1,frame+n)); $('scrub').value=frame; draw(); }
function loop(t){ if(playing&&DATA&&!showSnap){ acc+= (+$('speed').value); if(acc>=4){ acc=0;
    frame = frame+1>=DATA.frames.length ? 0 : frame+1; $('scrub').value=frame; draw(); } }
  raf=requestAnimationFrame(loop); }

// controls
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'⏸ pause':'▶ play'; if(playing) showSnap=false; };
$('back').onclick=()=>step(-1); $('fwd').onclick=()=>step(1);
$('scrub').oninput=e=>{ showSnap=false; frame=+e.target.value; draw(); };
$('gate').onchange=draw; $('trunk').onchange=draw;
$('snap').onclick=()=>{ showSnap=!showSnap; $('snap').style.borderColor=showSnap?'#43d18b':''; draw(); };
$('file').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>setData(JSON.parse(t))).catch(err=>alert('bad JSON: '+err)); };
const wrap=$('wrap');
wrap.ondragover=e=>{e.preventDefault();}; wrap.ondrop=e=>{e.preventDefault();
  const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>setData(JSON.parse(t))); };
window.onresize=()=>DATA&&draw();
raf=requestAnimationFrame(loop);

// --- live tuner (server mode: scripts/dump_layout_graph.py --serve) ----------
// Sliders re-request /api/trace, which runs the real fdcore.simulate — no JS
// physics. Per-gain [min,max,step]; unknown gains get a generic range.
const RANGES = {
  attract:[0,3,0.05], repel:[0,20,0.5], repel_aniso:[0.5,4,0.05],
  gravity_rail:[0,3,0.05], gravity_gnd:[0,3,0.05], flow:[0,3,0.05], side:[0,4,0.05],
  iters:[100,1500,50], margin:[0,6,0.254],
};
const TIP = {
  attract:'star attraction — how hard each pin is pulled toward its net centroid (the wirelength / rail-proximity gradient). ↑ = tighter clusters, shorter wires',
  repel:'overlap repulsion — push between two non-IC bodies per mm of AABB penetration (the symbol_overlap-gate gradient). ↑ = more spread, fewer overlaps',
  repel_aniso:'axis bias for resolving an overlap — 1.0 = pure least-penetration (isotropic); >1 makes horizontal separation cheaper, so collapsed same-net clusters (cap banks, parallel shunts) fan into a row instead of a column',
  gravity_rail:'constant upward drift on parts touching a rail/power net (lifts supplies above the IC)',
  gravity_gnd:'constant downward drift on parts touching ground (drops returns below the IC)',
  flow:'constant left→right bias by part role (inputs drift ←, outputs →) — the flow metric, as a gentle field',
  side:'one-sided barrier pushing each support past its assigned IC edge (uses real pin data; overrides flow for that part)',
  iters:'number of damped-Euler relaxation steps run before the layout is read out',
  margin:'keep-out gap (mm) around each body for the symbol_overlap gate — the clearance repulsion tries to maintain',
};
let DEFAULTS=null, traceTimer=0;
const fmt=(k,v)=> k==='iters' ? String(v|0) : (+v).toFixed(2);

function buildPanel(def){
  DEFAULTS=def;
  const fx=$('fixture'); fx.innerHTML='';
  for(const n of def.fixtures){ const o=document.createElement('option'); o.value=o.textContent=n; fx.appendChild(o); }
  if(def.fixtures.includes('mcu_rp2040')) fx.value='mcu_rp2040';  // the fixture this knob moves most
  const host=$('sliders'); host.innerHTML='';
  const items=[...Object.entries(def.gains), ['iters',def.iters], ['margin',def.margin]];
  for(const [k,v] of items){
    const [mn,mx,st]=RANGES[k]||[0,Math.max(2,(+v)*3),0.05];
    const row=document.createElement('div'); row.className='trow'+(k==='repel_aniso'?' star':'');
    if(TIP[k]) row.dataset.tip=TIP[k];   // whole-row tooltip so hovering the slider explains it too
    row.innerHTML=`<label>${k}</label>`
      +`<input type="range" min="${mn}" max="${mx}" step="${st}" value="${v}" data-key="${k}">`
      +`<span class="val">${fmt(k,v)}</span>`;
    const inp=row.querySelector('input'), val=row.querySelector('.val');
    inp.oninput=()=>{ val.textContent=fmt(k,inp.value); scheduleTrace(); };
    host.appendChild(row);
  }
  fx.onchange=requestTrace;
  $('reset').onclick=()=>{ for(const inp of host.querySelectorAll('input')){ const k=inp.dataset.key;
    const d=k==='iters'?def.iters:k==='margin'?def.margin:def.gains[k];
    inp.value=d; inp.nextElementSibling.textContent=fmt(k,d); } requestTrace(); };
  $('tune').classList.remove('hide');
  document.body.classList.add('live');   // reveal the KiCad-render pane (server mode only)
  requestTrace();
}
function scheduleTrace(){ clearTimeout(traceTimer); traceTimer=setTimeout(requestTrace,250); }
function tuneParams(){  // fixture + every slider, shared by /api/trace and /api/render
  const p=new URLSearchParams(); p.set('fixture',$('fixture').value);
  for(const inp of $('sliders').querySelectorAll('input')) p.set(inp.dataset.key,inp.value);
  return p;
}
let traceSeq=0;
function requestTrace(){
  const seq=++traceSeq;   // drop stale responses: a slow trace must not clobber a newer one
  const st=$('tstat'); st.className=''; st.textContent='computing…';
  fetch('/api/trace?'+tuneParams()).then(r=>r.json()).then(d=>{
    if(seq!==traceSeq) return;
    if(d.error){ st.className='err'; st.textContent=d.error; return; }
    setData(d); st.textContent='';
    scheduleRender();   // pair the animation with the real KiCad output
  }).catch(()=>{ if(seq!==traceSeq) return; st.className='err'; st.textContent='request failed'; });
}

// --- KiCad-render pane: the actual placed+routed PNG for the current gains ----
// kicad-cli render is ~0.4 s, so debounce after the trace settles and abort any
// in-flight render when the knobs move again (stale responses are dropped).
let renderTimer=0, renderAbort=null, lastObjURL=null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(requestRender,400); }
function requestRender(){
  if(renderAbort) renderAbort.abort();
  renderAbort=new AbortController();
  const rs=$('rstat'); rs.className=''; rs.textContent='rendering KiCad output…';
  fetch('/api/render?'+tuneParams(),{signal:renderAbort.signal})
    .then(async r=>{ if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||('HTTP '+r.status)); } return r.blob(); })
    .then(b=>{ const url=URL.createObjectURL(b), img=$('rimg');
      img.onload=()=>{ if(lastObjURL) URL.revokeObjectURL(lastObjURL); lastObjURL=url; };
      img.src=url; img.style.display='block'; $('rstat').textContent=''; })
    .catch(e=>{ if(e.name==='AbortError') return;
      const rs=$('rstat'); rs.className='err'; rs.textContent='render failed: '+e.message; });
}

// --- instant tooltips (data-tip) — native title= renders unreliably ----------
const tipEl=$('tip'); let curTip=null;
function showTip(text,el){ tipEl.textContent=text;
  const r=el.getBoundingClientRect(), tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=r.left, y=r.bottom+6;
  if(x+tw>innerWidth-8) x=innerWidth-8-tw; if(x<8) x=8;
  if(y+th>innerHeight-8) y=r.top-th-6;          // flip above when no room below
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px'; tipEl.classList.add('show'); }
function hideTip(){ tipEl.classList.remove('show'); }
document.addEventListener('mouseover',e=>{
  const el=e.target.closest?e.target.closest('[data-tip]'):null;
  if(el===curTip) return; curTip=el;
  const t=el&&el.getAttribute('data-tip');
  if(t) showTip(t,el); else hideTip();
});
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget){ curTip=null; hideTip(); } });

// Server mode → build the tuner. Otherwise fall back to graph.json / the picker.
fetch('/api/defaults').then(r=>r.ok?r.json():Promise.reject()).then(buildPanel)
  .catch(()=> fetch('graph.json').then(r=>r.ok?r.json():Promise.reject()).then(setData).catch(()=>{}));
</script>
