[project]
name = "pinflow-api"
version = "0.1.0"
description = "Pinflow backend service: kicad-sch-api emission + (future) datasheet ingestion"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "kicad-sch-api>=0.5.6",
    "kicad-python>=0.7.0",
    "anthropic>=0.45",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinflow_api"]
