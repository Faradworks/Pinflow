[package]
name = "pinflow-desktop"
version = "0.1.1"
description = "Pinflow desktop client"
authors = ["Faradworks"]
edition = "2021"

[lib]
name = "pinflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
